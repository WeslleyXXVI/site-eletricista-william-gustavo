<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente do Raio Elétrico -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#FFF275" />
      <stop offset="65%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FF9500" />
    </linearGradient>

    <!-- Gradiente da Borda / Anel -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="50%" stop-color="#FFE600" />
      <stop offset="100%" stop-color="#FF8800" />
    </linearGradient>

    <!-- Filtro de Brilho Neon Elétrico -->
    <filter id="electricGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradiente de Fundo -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#141c2e" />
      <stop offset="70%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#04060a" />
    </radialGradient>
  </defs>

  <!-- Fundo Circular com Borda de Alta Tensão -->
  <circle cx="256" cy="256" r="236" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="22" filter="drop-shadow(0 0 15px rgba(255, 215, 0, 0.6))" />

  <!-- Detalhe de Arco Elétrico Interno -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="rgba(255, 215, 0, 0.15)" stroke-width="4" stroke-dasharray="16 8" />

  <!-- Símbolo do Raio Elétrico com Glow -->
  <g filter="url(#electricGlow)">
    <polygon points="285,55 135,275 245,275 215,455 385,225 270,225" fill="url(#boltGrad)" />
  </g>
  
  <!-- Núcleo Branco de Alta Voltagem -->
  <polygon points="280,75 160,265 248,265 228,425 365,235 272,235" fill="rgba(255, 255, 255, 0.85)" opacity="0.9" />
</svg>
